name: Bootstrap Android runner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-android.yml

permissions:
  contents: write

jobs:
  generate:
    name: Generate and commit Android runner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Generate Android runner
        run: |
          flutter create \
            --empty \
            --platforms=android \
            --org com.silverlightning \
            --project-name autobook \
            .

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android .metadata pubspec.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: add Android runner"
          git push origin HEAD:main
