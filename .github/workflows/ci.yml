name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Configure temporary CI signing
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$RUNNER_TEMP/autobook-ci-release.jks"
          keytool -genkeypair \
            -keystore "$keystore_path" \
            -storepass android \
            -keypass android \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AutoBook CI"
          {
            echo "storeFile=$keystore_path"
            echo "storePassword=android"
            echo "keyAlias=ci"
            echo "keyPassword=android"
          } > android/key.properties

      - name: Verify project
        run: ./tool/verify.sh

      - name: Build release verification artifacts
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: autobook-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release verification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: autobook-ci-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/autobook-ci-release.jks"
