name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching pubspec.yaml
        required: true
        type: string

permissions: {}

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Require main and a semantic version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be started from main." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Match application version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [[ -z "$app_version" || "$RELEASE_TAG" != "v$app_version" ]]; then
            echo "Release tag $RELEASE_TAG must match pubspec version v$app_version." >&2
            exit 1
          fi

  build-sign:
    name: Test, build, and sign
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_CERT_SHA256: f02571c40741e2cb071564f5b63fd3dc38a875d0eda11a8c42269ed635bc2a58

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Set up Android toolchain
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool-all-1.18.3.jar
        run: ./tool/setup_android_toolchain.sh

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Release signing secrets are not configured." >&2
            exit 1
          fi

          umask 077
          keystore_path="$RUNNER_TEMP/autobook-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is invalid." >&2
            exit 1
          fi

          {
            echo "storeFile=$keystore_path"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

      - name: Analyze and test
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build signed release AAB and APK
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - name: Verify and package release artifacts
        id: package
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool-all-1.18.3.jar
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          source_aab="build/app/outputs/bundle/release/app-release.aab"
          test -s "$source_apk"
          test -s "$source_aab"

          ./tool/verify_android_artifacts.sh "$source_apk" "$source_aab"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"

          report="$RUNNER_TEMP/apksigner-report.txt"
          "$apksigner" verify --verbose --print-certs "$source_apk" | tee "$report"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report"
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' "$report"
          grep -F 'Number of signers: 1' "$report"

          actual_fingerprint="$(
            awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$report" |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [[ "$actual_fingerprint" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "APK certificate fingerprint does not match the AutoBook release key." >&2
            exit 1
          fi

          aab_report="$(jarsigner -verify "$source_aab")"
          printf '%s\n' "$aab_report"
          grep -F 'jar verified.' <<< "$aab_report"
          aab_fingerprint="$(
            keytool -printcert -jarfile "$source_aab" |
              awk -F': ' '/SHA256:/ {print $NF; exit}' |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [[ "$aab_fingerprint" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "AAB certificate fingerprint does not match the AutoBook release key." >&2
            exit 1
          fi

          mkdir -p release
          version="${RELEASE_TAG#v}"
          apk_path="release/AutoBook-$version.apk"
          aab_path="release/AutoBook-$version.aab"
          checksum_path="release/AutoBook-$version.sha256"
          cp "$source_apk" "$apk_path"
          cp "$source_aab" "$aab_path"
          (
            cd release
            sha256sum "AutoBook-$version.aab" "AutoBook-$version.apk" |
              tee "AutoBook-$version.sha256"
            sha256sum --check "AutoBook-$version.sha256"
          )
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Upload signed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AutoBook-${{ inputs.tag }}-signed
          path: |
            ${{ steps.package.outputs.aab_path }}
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/autobook-release.jks"

  publish:
    name: Publish immutable release
    needs: build-sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: AutoBook-${{ inputs.tag }}-signed
          path: release

      - name: Refuse an existing release or tag
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists." >&2
            exit 1
          fi

      - name: Create draft release
        id: draft
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/$RELEASE_TAG.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "AutoBook ${RELEASE_TAG#v}" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "AutoBook ${RELEASE_TAG#v}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Attach verified assets
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "release/AutoBook-$version.aab" \
            "release/AutoBook-$version.apk" \
            "release/AutoBook-$version.sha256" \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"

      - name: Remove failed draft
        if: failure() && steps.draft.outputs.created == 'true'
        run: gh release delete "$RELEASE_TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
