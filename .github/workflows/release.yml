name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching pubspec.yaml
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, sign, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      EXPECTED_CERT_SHA256: f02571c40741e2cb071564f5b63fd3dc38a875d0eda11a8c42269ed635bc2a58

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Validate release version
        run: |
          app_version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
            echo "Release tag $RELEASE_TAG must match pubspec version v$app_version." >&2
            exit 1
          fi

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore_path="$RUNNER_TEMP/autobook-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is missing or invalid." >&2
            exit 1
          fi

          {
            echo "storeFile=$keystore_path"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

      - name: Analyze and test
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Verify certificate and package APK
        id: package
        run: |
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "Android apksigner was not found." >&2
            exit 1
          fi

          report="$RUNNER_TEMP/apksigner-report.txt"
          "$apksigner" verify --verbose --print-certs "$source_apk" | tee "$report"
          actual_fingerprint="$(
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' "$report" |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [[ "$actual_fingerprint" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "APK certificate fingerprint does not match the AutoBook release key." >&2
            exit 1
          fi

          mkdir -p release
          apk_path="release/AutoBook-${RELEASE_TAG#v}.apk"
          cp "$source_apk" "$apk_path"
          sha256sum "$apk_path" | tee "$apk_path.sha256"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: AutoBook-${{ env.RELEASE_TAG }}-signed
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.apk_path }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="${{ steps.package.outputs.apk_path }}"
          checksum_path="$apk_path.sha256"
          notes_file=".github/release-notes/$RELEASE_TAG.md"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$apk_path" "$checksum_path" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          elif [[ -f "$notes_file" ]]; then
            gh release create "$RELEASE_TAG" \
              "$apk_path" "$checksum_path" \
              --target "$GITHUB_SHA" \
              --title "AutoBook $RELEASE_TAG" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              "$apk_path" "$checksum_path" \
              --target "$GITHUB_SHA" \
              --title "AutoBook $RELEASE_TAG" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/autobook-release.jks"
