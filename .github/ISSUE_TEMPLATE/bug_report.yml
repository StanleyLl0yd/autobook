name: Bug report
description: Report a reproducible problem in AutoBook.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include passwords, signing keys, personal vehicle data, or other sensitive information.
  - type: input
    id: version
    attributes:
      label: AutoBook version
      placeholder: 0.1.1 (build 2)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the smallest reliable sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add sanitized screenshots or logs if they help reproduce the issue.
